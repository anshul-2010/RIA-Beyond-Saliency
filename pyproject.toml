[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ria"
version = "0.1.0"
description = "Relational Interaction Attribution: third-order attribution of spatial relations in vision-language models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "transformers==4.52.4", "numpy", "pillow", "sentencepiece", "scipy", "scikit-learn"]

[project.optional-dependencies]
dev = ["pytest", "matplotlib", "gdown"]
text = ["spacy>=3.7"]   # relation-argument extraction (ria.text); python -m spacy download en_core_web_sm

[tool.setuptools]
packages = ["ria", "ria.datasets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
